name: Opdater renteprognose-data

# Henter de aktuelle prognoser fra alle banker én gang om ugen, genbygger
# datasættene og committer ændringerne, så GitHub Pages altid viser friske
# tal. Valideringen nedenfor er en gate: fejler den, committes der intet.
on:
  schedule:
    - cron: "0 6 * * 1" # mandage kl. 06:00 UTC
  workflow_dispatch: # tillad manuel kørsel fra GitHub UI'et

permissions:
  contents: write

# To samtidige kørsler ville skrive til de samme datafiler og kollidere på
# push. Lad den igangværende køre færdig i stedet for at afbryde den.
concurrency:
  group: opdater-renteprognose
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Installer afhængigheder
        run: pip install -r scraper/requirements.txt

      - name: Hent aktuelle prognoser (alle banker)
        run: python scraper/scrape.py update

      - name: Hent RD's historiske FlexLån-renter (facit)
        run: python scraper/scrape.py facit-rd

      - name: Validér de rå snapshots
        run: python scraper/validate_banks.py

      - name: Genbyg datasæt (alle banker)
        run: python scraper/build.py all

      - name: Genbyg bank-sammenligning
        run: python scraper/compare.py

      - name: Validér datasættene (gate før commit)
        run: python scraper/validate.py

      - name: Commit nye data (hvis ændret)
        run: |
          git config user.name "renteprognose-bot"
          git config user.email "renteprognose-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Auto-opdatering af prognosedata"
          git push
